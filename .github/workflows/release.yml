name: Build and release PIE binaries

on:
  push:
    tags: ['*']

permissions:
  contents: read

jobs:
  create-draft-release:
    runs-on: ubuntu-latest
    permissions:
      # contents:write is required to create the draft release.
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-tags: 'true'
          ref: ${{ github.ref }}
      - name: Create draft release from tag
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "${{ github.ref_name }}" >/dev/null 2>&1 \
            || gh release create "${{ github.ref_name }}" --title "${{ github.ref_name }}" --draft --generate-notes

  add-pie-binaries:
    needs: [create-draft-release]
    runs-on: ${{ matrix.operating-system }}
    strategy:
      # Don't cancel other cells if one fails; we want to see the full matrix.
      fail-fast: false
      matrix:
        # ubuntu-24.04      = native x86_64 Linux runner
        # ubuntu-24.04-arm  = native arm64 Linux runner (no QEMU; matches AWS
        #                     Graviton, Apple Silicon Docker, Raspberry Pi, etc.)
        # macos-14          = native arm64 macOS runner (Apple Silicon)
        operating-system: [ubuntu-24.04, ubuntu-24.04-arm, macos-14]
        # 8.5 is the current PHP stable release as of June 2026; verified
        # locally in a php:8.5-cli docker container (Debian trixie + libnode-dev).
        # Upstream v8js's own CI doesn't yet cover 8.5, so this is the
        # first place 8.5 gets continuous coverage.
        php-versions: ['8.1', '8.2', '8.3', '8.4', '8.5']
        zts-mode: [nts, ts]
        exclude:
          # Homebrew PHP is NTS only; setup-php cannot install a ZTS PHP on macOS.
          # This exclude is macOS-specific; both Ubuntu runners build TS and NTS.
          - operating-system: macos-14
            zts-mode: ts
    permissions:
      # contents:write is required to upload to the draft release.
      contents: write
    steps:
      - uses: actions/checkout@v6

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php-versions }}
        env:
          phpts: ${{ matrix.zts-mode }}

      - name: Install libv8 (Linux)
        if: runner.os == 'Linux'
        # NOTE: Ubuntu 24.04 (and current Debian) no longer ship `libv8-dev`.
        # `libnode-dev` provides Node's bundled V8 + headers at /usr/include/node,
        # which upstream's config.m4 finds when --with-v8js=/usr (it searches for
        # libnode.so as well as libv8.so). This is the same approach upstream
        # v8js's own CI uses for its non-Alpine Linux job.
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libnode-dev pkg-config
          echo "V8_PREFIX=/usr" >> "$GITHUB_ENV"

      - name: Install libv8 (macOS)
        if: runner.os == 'macOS'
        # NOTE: Homebrew's current `v8` formula is 14.x, which phpv8/v8js (php8
        # branch) cannot build against yet (V8 14.6 removed Local::Holder(),
        # changed SetAlignedPointerInInternalField, and replaced String::Write
        # with WriteV2). Tracked: https://github.com/phpv8/v8js/issues/546.
        # Until that's resolved, the macOS matrix cells will fail at `make` and
        # this workflow won't publish macOS binaries. Linux cells are unaffected.
        run: |
          brew install v8
          echo "V8_PREFIX=$(brew --prefix v8)" >> "$GITHUB_ENV"

      - name: Build and release
        continue-on-error: ${{ runner.os == 'macOS' }}
        uses: php/pie-ext-binary-builder@0.0.2
        with:
          release-tag: ${{ github.ref_name }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          configure-flags: "--with-v8js=${{ env.V8_PREFIX }}"
